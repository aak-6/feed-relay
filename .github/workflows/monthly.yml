name: monthly
on:
  schedule:
    - cron: "0 13 1 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FEED_CONFIG: ${{ secrets.FEED_CONFIG }}
      LISTINGS_API_KEY: ${{ secrets.LISTINGS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Part A
        run: python3 autos.py
        continue-on-error: true
      - name: Part B
        run: python3 listings.py
