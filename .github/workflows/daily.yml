name: daily
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: h-${{ github.run_id }}
          restore-keys: h-
      - name: Run
        env:
          FEED_CONFIG: ${{ secrets.FEED_CONFIG }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 relay.py hotels
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: h-${{ github.run_id }}
